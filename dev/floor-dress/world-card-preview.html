<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>观世牌预览（v6.17）</title>
<style>
    html, body { margin: 0; height: 100%; }
    body { background: #20242c; color: #e8eaf0; font: 15px/1.7 system-ui, sans-serif; }
    #chat { height: 100vh; overflow-y: auto; padding: 1.2rem 0 3rem; }
    #chat .mes { max-width: 46rem; margin: 0 auto 1.2rem; padding: 0 1rem; }
    #chat .mes[is_user="true"] .mes_text { background: #2b3038; border-radius: 0.5rem; padding: 0.7rem 0.9rem; }
    #chat .mes_text { white-space: pre-wrap; }
</style>
</head>
<body>
<div id="chat"></div>
<script type="module">
    // ---- 最小宿主桩：只喂楼层美化脚本真正读的那几个字段 ----
    const worldMeta = {
        clock: { day: 17, minute: 740 },
        info: { era: '斗气大陆', location: '魔兽山脉·死石坡（干沟石坎）', weather: '阴云压顶，风里带着湿土腥气', reputation: '', wanted: '' },
        tension: 'rising',
        nearEvents: [
            { id: 'e69', title: '死石坡凶兽外溢踪迹', text: '坡下干沟里出现大量踩踏痕，往北拖成一条血线', day: 17, weight: 'major', basis: '亲眼所见', location: '死石坡', endDay: 19 },
            { id: 'e50', title: '加列家中街设卡', text: '中街设卡盘查，过往行商都要交验货单', day: 16, weight: 'minor', basis: '亲眼所见', location: '乌坦城·中街', endDay: 18 },
            { id: 'e51', title: '药铺三访空手而归', text: '连去三趟药铺，柜上都说三阶魔核没到货', day: 15, weight: 'minor', basis: '亲眼所见', endDay: 20 },
        ],
        worldEvents: [
            { id: 'e48', title: '迦南学院招生队过境', text: '招生队在广场当街考校少年斗气', day: 13, weight: 'major', basis: '城门守卫闲聊', location: '乌坦城广场', endDay: 22 },
            { id: 'e42', title: '魔炎谷扬言寻仇', text: '魔炎谷放话要在半年内清算萧家', day: 12, weight: 'major', basis: '酒馆听说', endDay: 42 },
        ],
        tasks: [
            { id: 't7', title: '把玄重尺送到铁匠铺重铸', status: 'active', day: 15, endDay: 17, detail: '约好今天交货', basis: '铁匠托付' },
            { id: 't8', title: '替药老凑齐三阶魔核', status: 'active', day: 14, endDay: 22, detail: '拍卖行三日后开拍', basis: '药老托付' },
            { id: 't5', title: '查清干沟血线的来路', status: 'pending', day: 17, endDay: 19, basis: '亲眼所见' },
            { id: 't2', title: '三年之约前入迦南学院', status: 'active', day: 3, endDay: 102, basis: '主线' },
        ],
        factions: [
            { name: '萧家', stance: 'allied', dynamics: '在筹备护卫', type: '家族', leader: '萧战', day: 2, updatedDay: 17 },
            { name: '加列家族', stance: 'hostile', dynamics: '中街设卡盘剥行商', type: '家族', leader: '加列毕', day: 5, updatedDay: 17 },
            { name: '魔炎谷', stance: 'hostile', dynamics: '扬言寻仇', type: '宗门', leader: '未知', day: 12, updatedDay: 13 },
        ],
        people: [
            { name: '药老', attitude: '把你当半个徒弟看，嘴上不饶人', day: 2, updatedDay: 17 },
            { name: '刀疤护卫队长', attitude: '警惕，觉得你眼生又不像寻常行商', day: 16, updatedDay: 17 },
            { name: '货栈管事', attitude: '客气里带着打量，想从你嘴里套话', day: 16, updatedDay: 17 },
        ],
    };

    const chat = [
        { mes: '我去铁匠铺问问重铸的事。', is_user: true },
        { mes: '铁匠铺的炉火将半条街都烤得发烫。\n\n“你这尺子，重得不讲道理。”老铁匠用指节敲了敲玄重尺的脊，火星溅起来又灭，“重铸可以，得等三日——今日炉里排着加列家的活。”\n\n他把尺子推回来，压低声音：“坡下干沟昨夜出了事，血拖了一路。你要往北走，绕开。”', is_user: false },
    ];

    const chatEl = document.getElementById('chat');
    chatEl.innerHTML = chat.map((message, index) => `
        <div class="mes" mesid="${index}" is_user="${message.is_user}">
            <div class="mes_block"><div class="mes_text">${message.mes.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</div></div>
        </div>`).join('');

    globalThis.SillyTavern = {
        getContext: () => ({
            version: '1.19.0',
            characterId: 0,
            characters: [{ name: '斗破苍穹1', avatar: '斗破苍穹1.png' }],
            chat,
            chatId: 'preview',
            chatMetadata: { doupo_agent_world: worldMeta },
            extensionSettings: { doupo_agent_ui: { ui: { theme: 'gilt' } } },
        }),
    };

    await import('./doupo-floor-dress.js');
    await new Promise(resolve => setTimeout(resolve, 1200));
    document.title = `观世牌预览 ${globalThis.__DPD_VERSION__ ?? '?'}`;
</script>
</body>
</html>
